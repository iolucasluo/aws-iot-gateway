name: explorex-cn-cloud-staging

x-cloud-logging: &cloud-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  gateway-api:
    ports: !override []

  # ExploreX 平台面：与 gateway-api 同一镜像（同 module）的第二个入口进程。
  # 它不发布端口：门户 nginx 通过 application 网络按服务名访问 :14081，
  # 设备域写操作由它用项目自身凭证签名代理到 gateway-api:14080。
  explorex-platform-api:
    image: ${CN_STAGING_GATEWAY_IMAGE:?CN_STAGING_GATEWAY_IMAGE is required}
    command:
      - /usr/local/bin/explorex-platform-api
    env_file:
      - ${CN_STAGING_PLATFORM_ENV_FILE:?CN_STAGING_PLATFORM_ENV_FILE is required for cloud staging}
    environment:
      PLATFORM_LISTEN_ADDRESS: 0.0.0.0:14081
      PLATFORM_GATEWAY_INTERNAL_BASE_URL: http://gateway-api:14080
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:14081/healthz >/dev/null
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      - private
      - application
    restart: unless-stopped
    logging: *cloud-logging

  # 三门户：纯静态 SPA（nginx），/api 由镜像内的 nginx 反代到 explorex-platform-api:14081。
  admin-console:
    image: ${CN_STAGING_ADMIN_CONSOLE_IMAGE:?CN_STAGING_ADMIN_CONSOLE_IMAGE is required for cloud staging}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/ >/dev/null
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      - application
    restart: unless-stopped
    logging: *cloud-logging

  developer-portal:
    image: ${CN_STAGING_DEVELOPER_PORTAL_IMAGE:?CN_STAGING_DEVELOPER_PORTAL_IMAGE is required for cloud staging}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/ >/dev/null
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      - application
    restart: unless-stopped
    logging: *cloud-logging

  manufacturer-portal:
    image: ${CN_STAGING_MANUFACTURER_PORTAL_IMAGE:?CN_STAGING_MANUFACTURER_PORTAL_IMAGE is required for cloud staging}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/ >/dev/null
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      - application
    restart: unless-stopped
    logging: *cloud-logging

  rtc-signaling:
    ports: !override []

  mqtt-mtls:
    ports: !override
      - "0.0.0.0:8883:8883"

  turn:
    command: !override
      - -n
      - --log-file=stdout
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=${CN_STAGING_TURN_REALM:?CN_STAGING_TURN_REALM is required}
      - --user=${CN_STAGING_TURN_USER:?CN_STAGING_TURN_USER is required}:${CN_STAGING_TURN_PASSWORD:?CN_STAGING_TURN_PASSWORD is required}
      - --external-ip=${CN_CLOUD_PUBLIC_IP:?CN_CLOUD_PUBLIC_IP is required}
      - --min-port=${CN_STAGING_TURN_RELAY_MIN_PORT:-49360}
      - --max-port=${CN_STAGING_TURN_RELAY_MAX_PORT:-49400}
    ports: !override
      - "0.0.0.0:3478:3478/udp"
      - "0.0.0.0:3478:3478/tcp"
      - "0.0.0.0:${CN_STAGING_TURN_RELAY_MIN_PORT:-49360}-${CN_STAGING_TURN_RELAY_MAX_PORT:-49400}:${CN_STAGING_TURN_RELAY_MIN_PORT:-49360}-${CN_STAGING_TURN_RELAY_MAX_PORT:-49400}/udp"

  edge-proxy:
    image: caddy:2.10.2-alpine
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    read_only: true
    tmpfs:
      - /config:size=8m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:80:8080"
      - "0.0.0.0:443:8443"
    volumes:
      - ./Caddyfile.cloud-staging:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      gateway-api:
        condition: service_healthy
      rtc-signaling:
        condition: service_healthy
    networks:
      - application
      - edge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
