name: aws-iot-gateway-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${GATEWAY_LOCAL_POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${GATEWAY_LOCAL_POSTGRES_PASSWORD:-gateway-local-only}
      POSTGRES_DB: ${GATEWAY_LOCAL_POSTGRES_DATABASE:-aws_iot_gateway}
    ports:
      - "127.0.0.1:${GATEWAY_LOCAL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${GATEWAY_LOCAL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
