name: explorex-cn-single-node

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-application-runtime: &application-runtime
  image: ${CN_STAGING_GATEWAY_IMAGE:-explorex-cn-gateway:local}
  build:
    context: ../..
    dockerfile: Dockerfile
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *bounded-logging

services:
  postgres:
    logging: *bounded-logging

  redis:
    logging: *bounded-logging

  mqtt-mtls:
    logging: *bounded-logging

  turn:
    logging: *bounded-logging

  gateway-seed:
    <<: *application-runtime
    profiles:
      - single-node
    command:
      - /usr/local/bin/aws-iot-gateway-db-seed
    env_file:
      - ${CN_STAGING_GATEWAY_ENV_FILE:?CN_STAGING_GATEWAY_ENV_FILE is required for single-node profile}
    environment:
      GATEWAY_ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"

  rtc-signaling:
    <<: *application-runtime
    profiles:
      - single-node
    command:
      - /usr/local/bin/explorex-signal
    env_file:
      - ${CN_STAGING_SIGNAL_ENV_FILE:?CN_STAGING_SIGNAL_ENV_FILE is required for single-node profile}
    environment:
      EXPLOREX_SIGNAL_LISTEN_ADDRESS: 0.0.0.0:18084
      EXPLOREX_SIGNAL_AUTH_TOKEN: ${CN_STAGING_REALTIME_AUTH_TOKEN:?CN_STAGING_REALTIME_AUTH_TOKEN is required for single-node profile}
    ports:
      - "${CN_STAGING_EDGE_BIND_ADDRESS:-127.0.0.1}:${CN_STAGING_SIGNAL_PORT:-28084}:18084"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:18084/healthz >/dev/null
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - application
      - edge
    restart: unless-stopped

  gateway-api:
    <<: *application-runtime
    profiles:
      - single-node
    command:
      - /usr/local/bin/aws-iot-gateway
    env_file:
      - ${CN_STAGING_GATEWAY_ENV_FILE:?CN_STAGING_GATEWAY_ENV_FILE is required for single-node profile}
    environment:
      GATEWAY_LISTEN_ADDRESS: 0.0.0.0:14080
      DOMESTIC_REALTIME_ENDPOINT: http://rtc-signaling:18084
      DOMESTIC_REALTIME_AUTH_TOKEN: ${CN_STAGING_REALTIME_AUTH_TOKEN:?CN_STAGING_REALTIME_AUTH_TOKEN is required for single-node profile}
    ports:
      - "${CN_STAGING_EDGE_BIND_ADDRESS:-127.0.0.1}:${CN_STAGING_GATEWAY_PORT:-24083}:14080"
    volumes:
      - type: bind
        source: ${CN_STAGING_RUNTIME_DIR:?CN_STAGING_RUNTIME_DIR is required for single-node profile}
        target: /run/explorex
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt-mtls:
        condition: service_healthy
      rtc-signaling:
        condition: service_healthy
      gateway-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:14080/healthz >/dev/null
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - private
      - application
      - edge
    restart: unless-stopped

networks:
  application:
    driver: bridge
    internal: true
