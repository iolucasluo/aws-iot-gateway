name: explorex-cn-cloud-staging

services:
  gateway-api:
    ports: !override []

  rtc-signaling:
    ports: !override []

  mqtt-mtls:
    ports: !override
      - "0.0.0.0:8883:8883"

  turn:
    command: !override
      - -n
      - --log-file=stdout
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=${CN_STAGING_TURN_REALM:?CN_STAGING_TURN_REALM is required}
      - --user=${CN_STAGING_TURN_USER:?CN_STAGING_TURN_USER is required}:${CN_STAGING_TURN_PASSWORD:?CN_STAGING_TURN_PASSWORD is required}
      - --external-ip=${CN_CLOUD_PUBLIC_IP:?CN_CLOUD_PUBLIC_IP is required}
      - --min-port=${CN_STAGING_TURN_RELAY_MIN_PORT:-49360}
      - --max-port=${CN_STAGING_TURN_RELAY_MAX_PORT:-49400}
    ports: !override
      - "0.0.0.0:3478:3478/udp"
      - "0.0.0.0:3478:3478/tcp"
      - "0.0.0.0:${CN_STAGING_TURN_RELAY_MIN_PORT:-49360}-${CN_STAGING_TURN_RELAY_MAX_PORT:-49400}:${CN_STAGING_TURN_RELAY_MIN_PORT:-49360}-${CN_STAGING_TURN_RELAY_MAX_PORT:-49400}/udp"

  edge-proxy:
    image: caddy:2.10.2-alpine
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    read_only: true
    tmpfs:
      - /config:size=8m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:80:8080"
      - "0.0.0.0:443:8443"
    volumes:
      - ./Caddyfile.cloud-staging:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      gateway-api:
        condition: service_healthy
      rtc-signaling:
        condition: service_healthy
    networks:
      - application
      - edge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
